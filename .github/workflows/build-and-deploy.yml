name: Build and deploy dashboard

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config.yml"
      - "templates/**"
      - "static/**"
      - "ci_glance/**"
      - "generate.py"
      - "requirements.txt"
      - ".github/workflows/build-and-deploy.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python generate.py
        env:
          # The auto-injected GITHUB_TOKEN reads the Actions API of any PUBLIC
          # repo, not just this one — measured, not assumed: a run using only
          # this token fetched all 29 workflows across 15 repos with zero
          # failures, at 1,000 requests/hour.
          #
          # It used to prefer a DASH_TOKEN PAT, and that indirection is what
          # kept breaking. `secrets.DASH_TOKEN || secrets.GITHUB_TOKEN` means a
          # *present but broken* PAT shadows a working built-in token, so the
          # board died twice for a reason that had nothing to do with the board:
          # once on an expired PAT (401 on every repo) and once on a replacement
          # that lacked Actions:read (403 on every repo).
          #
          # A PAT is only needed to track PRIVATE repos. If that day comes, add
          # DASH_TOKEN back here — and give it Actions:read on every repo in
          # config.yml, not just the private ones.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
