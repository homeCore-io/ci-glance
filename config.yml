# ci-glance dashboard configuration.
# Edit this file to point at your own repos and workflows, then run
# `python generate.py` (or let the bundled GitHub Action do it for you).

title: homeCore Builds
subtitle: "Workflow status across homeCore repositories"
# footer: "Custom footer text — leave empty for the default 'Last Updated ...'"

# Optional theme overrides for the sparkline colors.
# theme:
#   ok:    "#1D9E75"
#   fail:  "#E24B4A"
#   flaky: "#BA7517"

settings:
  history_length: 20      # number of runs per sparkline
  flaky_threshold: 2      # failures in history to flag as FLAKY
  recovery_streak: 5      # consecutive green runs that clear FLAKY (0 = never)
  sort: failing-first     # failing-first | config | alpha
  refresh_seconds: 300    # auto-reload every N seconds (0 to disable)
  timezone: America/New_York

# Reusable workflow definitions, referenced by `id` from each repo below.
workflows:
  - id: ci
    file: ci.yml          # filename in .github/workflows/
    label: CI
    last_label: time      # time | version | branch | sha

  - id: release
    file: release.yml
    label: Rel
    last_label: version

# Repos to track. Each entry can list a subset of workflow ids if not all apply.
repos:
  # ── Core ──────────────────────────────────────────────────────────────
  - { repo: homeCore-io/homeCore,      workflows: [ci, release] }

  # ── Plugins ───────────────────────────────────────────────────────────
  - { repo: homeCore-io/hc-hue,        workflows: [ci, release] }
  - { repo: homeCore-io/hc-yolink,     workflows: [ci, release] }
  - { repo: homeCore-io/hc-lutron,     workflows: [ci, release] }
  - { repo: homeCore-io/hc-sonos,      workflows: [ci, release] }
  - { repo: homeCore-io/hc-wled,       workflows: [ci, release] }
  - { repo: homeCore-io/hc-isy,        workflows: [ci, release] }
  - { repo: homeCore-io/hc-zwave,      workflows: [ci, release] }
  - { repo: homeCore-io/hc-caseta,     workflows: [ci, release] }
  - { repo: homeCore-io/hc-thermostat, workflows: [ci, release] }
  - { repo: homeCore-io/hc-ecowitt,    workflows: [ci, release] }
  - { repo: homeCore-io/hc-roku,       workflows: [ci, release] }

  # ── Clients ───────────────────────────────────────────────────────────
  # hc-web is the web UI and ships as its own container — the other half of
  # the deployed stack alongside hc-core, so its red is as important as core's.
  - { repo: homeCore-io/hc-web,        workflows: [ci, release] }
  - { repo: homeCore-io/hc-tui,        workflows: [ci, release] }
  - { repo: homeCore-io/hc-web-leptos, workflows: [ci] }

  # homeCore-io/docker used to be tracked for its appliance build. The
  # appliance is retired and appliance-release.yml is deleted, so that entry
  # watched a workflow that no longer exists — a permanently blank column.
  # The repo now only holds the Dockerfile and compose files; it builds
  # nothing of its own, so there is nothing here to track.

  # Repos without CI/Release workflows yet (omitted until wired):
  #   hc-plugin-sdk-rs, hc-captest, hc-scripts (reusable workflows only),
  #   hc-mcp, plus the inactive client variants.
